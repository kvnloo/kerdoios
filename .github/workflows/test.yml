name: unit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Claim-expiry script (offline, fake gh)
        run: python3 tests/expire_claims.py
